name: ci

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 13 * * 1"
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        name: checkout
      - uses: oven-sh/setup-bun@v2
        name: setup[bun]
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        name: setup[node]
        with:
          node-version: "24"
      - name: deps
        run: bun install --frozen-lockfile
      - name: fixture-deps
        run: bun install --frozen-lockfile --cwd tests/fixtures/next
      - name: types
        run: bunx --no-install tsc --noEmit
      - name: check
        run: bun run check
      - name: test
        run: bun run test
      - uses: actions/setup-node@v6
        with:
          node-version: "20.9.0"
      - name: Verify Node floor
        run: |
          bun test tests/package.test.ts
          NEXT_COMPAT_VERSION=16.0.0 NEXT_COMPAT_BUNDLER=turbopack bun test tests/compatibility.test.ts
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Build regression cases
        run: |
          NEXT_COMPAT_VERSION=16.4.6 NEXT_COMPAT_BUNDLER=turbopack NEXT_COMPAT_FROM_PARENT=1 bun test tests/compatibility.test.ts
          NEXT_COMPAT_VERSION=16.4.6 NEXT_COMPAT_BUNDLER=turbopack NEXT_COMPAT_MODE=adapter NEXT_COMPAT_BASE_PATH=1 bun test tests/compatibility.test.ts

  compatibility:
    uses: ./.github/workflows/compatibility.yml
    with:
      scope: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'checkpoints' }}
      ref: ${{ github.sha }}
